apiVersion: v1
kind: Service
metadata:
  name: codexexample-app
  namespace: codex-example
spec:
  selector:
    app: codexexample-app
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codexexample-app
  namespace: codex-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codexexample-app
  template:
    metadata:
      labels:
        app: codexexample-app
    spec:
      containers:
        - name: codexexample-app
          image: codexexample:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: '3001'
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: codexexample-secrets
                  key: MONGODB_URI
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: codexexample-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codexexample-secrets
                  key: ADMIN_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: codexexample-secrets
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
